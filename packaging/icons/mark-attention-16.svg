<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Cadent mark - attention, hand-corrected 16 grid. Serves 16 and 20.

       A single-column stroke and a single-pixel dot, centred in the three
       columns the cradle leaves. The gap between them is the whole
       exclamation at this size, so it gets two rows, not one. -->
  <rect x="6" y="2" width="4" height="6" rx="2" fill="#000"/>
  <path d="M4 7 a4 4 0 0 0 8 0" fill="none" stroke="#000"
        stroke-width="2" stroke-linecap="round"/>
  <rect x="7" y="11" width="2" height="2" fill="#000"/>
  <rect x="5" y="13" width="6" height="1" fill="#000"/>
  <rect x="14" y="4" width="1" height="5" fill="#000"/>
  <rect x="14" y="11" width="1" height="1" fill="#000"/>
</svg>
