<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Cadent mark - ready, hand-corrected 16 grid. Serves 16 and 20.

       The 24 grid's 0.84 cradle is *not* reproduced here: at this size the
       difference between 1.0 and 0.84 is under a pixel, and shrinking costs
       more legibility than the extra clearance buys. The cradle stays full
       size on the box centre (ink 3-13) and the state zone is the three
       columns at 13-15.

       Every edge lands on a whole pixel: the cradle is 2.0 thick so it fills
       rows 9-11 instead of straddling three at half alpha, and the base is a
       single row. The flow lines taper 3/2/1 - the last is one pixel, which
       is what a taper leaves at this size. -->
  <rect x="6" y="2" width="4" height="6" rx="2" fill="#000"/>
  <path d="M4 7 a4 4 0 0 0 8 0" fill="none" stroke="#000"
        stroke-width="2" stroke-linecap="round"/>
  <rect x="7" y="11" width="2" height="2" fill="#000"/>
  <rect x="5" y="13" width="6" height="1" fill="#000"/>
  <rect x="13" y="4" width="3" height="1" fill="#000"/>
  <rect x="13" y="7" width="2" height="1" fill="#000"/>
  <rect x="13" y="10" width="1" height="1" fill="#000"/>
</svg>
