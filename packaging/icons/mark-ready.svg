<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Cadent mark - ready. One mark on every platform; supersedes the
       darwin-only composition of #164.

       The cradle sits on the box centre at 0.84 of the master scale (its ink
       spans 5.7-18.3), which frees the 18.6-23.4 zone for the state element.
       The scale is baked into the coordinates rather than carried as a
       transform, so every number here is the number that rasterises.

       Alpha is the whole signal: the tray paints this silhouette in an ink
       the OS picks (darwin) or one derived from the taskbar (win32), so the
       fill is nominal black. Only build_icons.py's app-icon containers
       substitute a brand colour, by replacing #000. -->
  <rect x="9.48" y="4.02" width="5.04" height="8.82" rx="2.52" fill="#000"/>
  <path d="M6.54 10.74 a5.46 5.46 0 0 0 10.92 0" fill="none" stroke="#000"
        stroke-width="1.68" stroke-linecap="round"/>
  <rect x="11.16" y="15.78" width="1.68" height="2.94" fill="#000"/>
  <rect x="8.22" y="18.38" width="7.56" height="1.85" rx="0.92" fill="#000"/>
  <rect x="18.6" y="7.5" width="4.8" height="2" rx="1" fill="#000"/>
  <rect x="18.6" y="12" width="3.6" height="2" rx="1" fill="#000"/>
  <rect x="18.6" y="16.5" width="2.4" height="2" rx="1" fill="#000"/>
</svg>
