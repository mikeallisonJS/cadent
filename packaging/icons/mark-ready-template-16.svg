<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Cadent mark - ready, darwin template, hand-corrected 16 grid (#164).
       Every edge on a whole pixel, mirroring mark-ready-16.svg's corrections:
       cradle thickened to 2.0, base a single pixel row. Flow lines become
       three single-pixel rows so they read as lines, not smudge. -->
  <rect x="3" y="2" width="4" height="6" rx="2" fill="#000"/>
  <path d="M1 7 a4 4 0 0 0 8 0" fill="none" stroke="#000"
        stroke-width="2" stroke-linecap="round"/>
  <rect x="4" y="11" width="2" height="2" fill="#000"/>
  <rect x="2" y="13" width="6" height="1" fill="#000"/>
  <rect x="10" y="4" width="5" height="1" fill="#000"/>
  <rect x="10" y="7" width="4" height="1" fill="#000"/>
  <rect x="10" y="10" width="3" height="1" fill="#000"/>
</svg>
