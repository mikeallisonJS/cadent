  <path d="M1 10.5 a6.5 6.5 0 0 0 13 0" fill="none" stroke="#000"
        stroke-width="2" stroke-linecap="round"/>
  <rect x="6.5" y="16.5" width="2" height="3.5" fill="#000"/>
  <rect x="3" y="19.6" width="9" height="2.2" rx="1.1" fill="#000"/>
