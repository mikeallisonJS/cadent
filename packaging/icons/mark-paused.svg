  <path d="M6.54 10.74 a5.46 5.46 0 0 0 10.92 0" fill="none" stroke="#000"
        stroke-width="1.68" stroke-linecap="round"/>
  <rect x="11.16" y="15.78" width="1.68" height="2.94" fill="#000"/>
  <rect x="8.22" y="18.38" width="7.56" height="1.85" rx="0.92" fill="#000"/>
  <rect x="18.8" y="8.5" width="1.6" height="7" rx="0.8" fill="#000"/>
  <rect x="21.6" y="8.5" width="1.6" height="7" rx="0.8" fill="#000"/>
</svg>
