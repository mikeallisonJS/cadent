<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Cadent mark - paused. Same cradle as ready; the flow lines give way to
       two pause bars, centred in the 18.6-23.4 state zone.

       States differ by silhouette on every platform now, not by colour: the
       tray mark is painted in one ink per OS surface, so shape is the only
       thing left to say ready from paused with. -->
