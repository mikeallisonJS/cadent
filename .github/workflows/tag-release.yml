# Tag on release-PR merge (#168): reads the just-merged version from
# pyproject.toml, tags the merge commit, publishes the GitHub Release with the
# curated CHANGELOG.md section (auto-generated notes kept as an appendix), and
# dispatches build-installer at the tag ref. The explicit dispatch exists
# because a GITHUB_TOKEN-pushed tag never fires `on: push: tags` — and
# build-installer already derives everything it needs from the tag ref, so it
# needs no changes. Creating the release first means build-installer's own
# `gh release create --generate-notes` sees it exists and only uploads.

name: tag-release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$V" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "v$V"

      - name: Publish release with curated notes
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release.py notes --version "$V" > body.md
          echo "" >> body.md
          echo "<details><summary>All changes</summary>" >> body.md
          echo "" >> body.md
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="v$V" -q .body >> body.md
          echo "" >> body.md
          echo "</details>" >> body.md
          gh release create "v$V" --title "v$V" --notes-file body.md

      - name: Build installer at the tag
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: gh workflow run build-installer.yml --ref "v$V"
