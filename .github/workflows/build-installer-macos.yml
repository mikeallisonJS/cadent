# Build the macOS installer (#171): PyInstaller onedir + BUNDLE via
# scripts/build.py, wrapped in a drag-to-Applications disk image by
# scripts/build_dmg.py. The macOS twin of build-installer.yml, kept as its own
# file because almost nothing between the two legs is shared — different
# artefact, different wrapper, and a signing story Windows doesn't have.
#
# Runs on version-tag push (v*) and by hand, like the Windows leg.
# scripts/smoke_frozen.py stays a local step on both: the app's first run
# downloads models, which a CI runner shouldn't do.
#
# Apple silicon only. The runtime stack has no universal2 build to freeze —
# onnxruntime and ctranslate2 ship arm64 wheels, and llama-cpp-python compiles
# from source here (docs/research/macos-dev-environment.md §2b) — so macos-15
# is the target, matching the M1 Max the port is benched on and the test
# workflow's macOS leg. Pinned by name, and it has to move when GitHub retires
# the image (macos-14 went on 2026-11-02): a retired label cancels the job
# rather than failing it, and since the two release legs are independent that
# would ship a release with no disk image.
#
# Signing is optional and secret-gated. With no secrets the build is ad-hoc
# signed, which is all arm64 needs to *load* the app; the user right-clicks ▸
# Open past Gatekeeper once, and — because TCC keys its grants off the
# signature — re-grants Accessibility after an update. Add the six secrets
# below and the same workflow produces a signed, notarized image where neither
# is true:
#
#   MACOS_CERTIFICATE           Developer ID Application .p12, base64-encoded
#   MACOS_CERTIFICATE_PASSWORD  the .p12 export password
#   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_APPLE_ID       Apple ID of the developer account
#   MACOS_NOTARY_PASSWORD       an app-specific password for that Apple ID
#   MACOS_NOTARY_TEAM_ID        the 10-character team id

name: build-installer-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # gh release upload on tag builds

jobs:
  dmg:
    runs-on: macos-15
    env:
      # The oldest macOS the app claims to run on — keep it equal to
      # LSMinimumSystemVersion in packaging/cadent.spec. Exported for the whole
      # job because the llama.cpp build below reads it: unset, a from-source
      # build targets the machine it is built on, so moving this job to a
      # newer runner would quietly raise the floor of the cleanup model's
      # libraries with it.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # Pinned because nothing else chooses it: with no pin uv takes the
          # first interpreter the image offers, and macos-15 offers 3.15, which
          # ctranslate2 publishes no wheel for. 3.14 is what the macos-14 image
          # gave this build, and what the test workflow's macOS leg runs — keep
          # the two in step, so the suite covers the interpreter that ships.
          python-version: "3.14"

      - name: Determine version
        id: version
        run: |
          # Digits and dots only: this becomes CFBundleVersion, which macOS
          # compares numerically across updates. Manual runs build 0.0.0.
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *)            version="0.0.0" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        # all-extras brings the cleanup extra, and on macOS that means
        # compiling llama.cpp — a few minutes, and the only way to get the
        # Metal backend scripts/build.py insists on.
        #
        # Clearing the package from uv's cache first makes that compile happen
        # on every run. uv keeps the wheel it built and does not key it on the
        # deployment target, so one built under a different target is reused
        # as-is — and `--refresh-package` does not help: it re-checks the
        # sdist, finds it unchanged, and hands back the same wheel.
        run: |
          uv cache clean llama-cpp-python
          uv sync --all-extras

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # Secrets aren't readable from `if:` expressions, so the decision is
          # made here once and every later step keys off these outputs.
          #
          # Three states, not two. No secrets at all is the documented ad-hoc
          # path. A half-configured set is a mistake, and falling back there
          # would hand an uncertified image to somebody who asked for a signed
          # one — so it fails the build instead, while the secrets are still
          # the obvious thing to look at.
          present=0
          absent=0
          for value in "$CERTIFICATE" "$CERTIFICATE_PASSWORD" "$IDENTITY"; do
            if [ -n "$value" ]; then present=$((present + 1)); else absent=$((absent + 1)); fi
          done

          if [ "$present" -eq 0 ]; then
            echo "No Developer ID secrets — building ad-hoc signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$absent" -ne 0 ]; then
            echo "::error::Developer ID signing needs all three of MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD and MACOS_SIGNING_IDENTITY — $absent of them are unset."
            exit 1
          fi

          keychain="$RUNNER_TEMP/cadent-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Without the partition list codesign prompts for the key, and a
          # runner has nobody to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          # Later steps take the identity from here rather than from the secret
          # directly, so it cannot be set unless the certificate it names is
          # actually in a keychain. Still masked in logs, being a secret value.
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build frozen app (PyInstaller .app bundle)
        env:
          CADENT_VERSION: ${{ steps.version.outputs.version }}
          # Empty unless the certificate imported, which the spec reads as
          # "ad-hoc". Reading the step output rather than the secret is what
          # keeps that one decision honest: an identity with no key behind it
          # would fail here, deep inside PyInstaller. It signs each collected
          # binary as it places it — innermost first, the order codesign wants
          # and the one `--deep` gets wrong.
          CADENT_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: uv run python scripts/build.py --skip-sync

      - name: Report the oldest macOS the bundle can load on
        run: |
          # Info.plist only *declares* a minimum; what decides whether the app
          # loads is the highest `minos` among the binaries inside it, and
          # those come from three places — the interpreter, the prebuilt
          # wheels, and the llama.cpp compiled above. This reads all of them
          # and warns when the bundle needs more than it declares. A warning,
          # not a failure: the prebuilt binaries' floors are not this build's
          # to change, only to make visible.
          floor="$MACOSX_DEPLOYMENT_TARGET"
          report="$RUNNER_TEMP/minos.tsv"
          find dist/Cadent.app -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0 |
            while IFS= read -r -d '' file; do
              # -arch: a universal wheel's Intel slice has a floor of its own,
              # and it is not the one this Apple-silicon app loads.
              minos=$(otool -arch arm64 -l "$file" 2>/dev/null | awk '$1 == "minos" { print $2; exit }')
              if [ -n "$minos" ]; then
                printf '%s\t%s\n' "$minos" "${file#dist/Cadent.app/}"
              fi
            done | sort -t. -k1,1nr -k2,2nr > "$report"

          if [ ! -s "$report" ]; then
            echo "::error::found no Mach-O binaries in dist/Cadent.app to read a minimum from"
            exit 1
          fi

          echo "Binaries per minimum macOS version:"
          cut -f1 "$report" | uniq -c
          echo
          echo "The llama.cpp libraries built by this job:"
          grep 'llama_cpp/lib/' "$report" || echo "  (none found)"
          echo
          echo "The fifteen highest:"
          head -15 "$report"

          highest=$(head -1 "$report" | cut -f1)
          above=$(awk -v h="$highest" -v f="$floor" 'BEGIN {
            split(h, a, "."); split(f, b, ".")
            print ((a[1] > b[1]) || (a[1] == b[1] && a[2] + 0 > b[2] + 0)) ? "yes" : "no"
          }')
          if [ "$above" = "yes" ]; then
            echo "::warning::The bundle declares macOS $floor as its minimum but contains binaries that need macOS $highest — see this step's log for which."
          fi

      - name: Verify the signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          # --strict catches a nested binary the signing pass missed; the
          # runtime flag is what notarization refuses builds without.
          codesign --verify --deep --strict --verbose=2 dist/Cadent.app
          codesign --display --verbose=4 dist/Cadent.app 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "::error::app is not hardened-runtime signed"; exit 1; }

      - name: Build the disk image
        run: uv run python scripts/build_dmg.py --version ${{ steps.version.outputs.version }}

      - name: Sign the disk image
        if: steps.signing.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: codesign --force --timestamp --sign "$IDENTITY" dist/installer/*.dmg

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          present=0
          absent=0
          for value in "$APPLE_ID" "$APPLE_PASSWORD" "$TEAM_ID"; do
            if [ -n "$value" ]; then present=$((present + 1)); else absent=$((absent + 1)); fi
          done

          # The same three states as the certificate above, with one
          # difference: signed-but-not-notarized is a real rung rather than a
          # mistake — Gatekeeper still stops the first open, but TCC grants
          # survive updates — so no notary secrets warns and ships. A partial
          # set still fails, and fails here rather than inside notarytool with
          # an empty password, which would lose the image built two steps ago.
          if [ "$present" -eq 0 ]; then
            echo "::warning::Signed but not notarized (no notary secrets) — Gatekeeper still blocks the first open."
            exit 0
          fi
          if [ "$absent" -ne 0 ]; then
            echo "::error::Notarization needs all three of MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_PASSWORD and MACOS_NOTARY_TEAM_ID — $absent of them are unset."
            exit 1
          fi

          dmg=$(ls dist/installer/*.dmg)
          # Submitting the image notarizes the app inside it. Stapling the
          # image is what makes the check work offline; an app dragged out and
          # first opened with no network still needs one online lookup.
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Cadent-${{ steps.version.outputs.version }}-arm64-dmg
          path: dist/installer/*.dmg
          if-no-files-found: error

      - name: Attach the disk image to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag-release.yml publishes the release before dispatching this, and
          # the Windows leg may get here first — either way, create is a
          # no-op we ignore and upload is the step that matters.
          gh release create "$GITHUB_REF_NAME" --generate-notes || echo "release exists"
          gh release upload "$GITHUB_REF_NAME" dist/installer/*.dmg --clobber
