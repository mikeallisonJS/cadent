# The seam's guarantee, enforced (#143, spec §1.4): the suite runs on both
# OSes on every push and PR, so an OS import outside a platform adapter fails
# in CI on the OS that lacks it — the import-walk test makes the rule real.
# Adapter-internal tests platform-skip themselves.

name: test

# push is main-only: every branch lands by PR, and push+pull_request on the
# same branch would run every suite twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 pinned by name — an Apple-silicon runner, matching the M1
        # Max the port is benched on. The spec (§1.4) names macos-14, which
        # GitHub retired on 2026-11-02; a retired label doesn't fail, it
        # cancels the leg before a step runs, so the pin has to move when the
        # image does. `macos-latest` would move by itself, and take the suite
        # onto a new OS mid-PR.
        #
        # Per-OS QPA: the Windows runner has a real desktop session and the
        # real `windows` platform resolves real system fonts — under
        # `offscreen` there, Segoe UI falls back to something ~1.4x wider
        # and every geometry test measures a font no user has. The macOS
        # runner leg runs `offscreen`, where fonts resolve correctly.
        #
        # Python on the macOS leg is pinned because nothing else chooses it:
        # with no pin uv takes the first interpreter the image offers, and
        # macos-15 offers 3.15, which ctranslate2 publishes no wheel for. 3.14
        # is what the macos-14 image gave this leg, and what the disk image is
        # built with (build-installer-macos.yml) — keep the two in step. A leg
        # with no `python` key keeps the image's default.
        include:
          - os: windows-latest
            qpa: windows
          - os: macos-15
            qpa: offscreen
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
